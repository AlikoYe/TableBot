<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Nomad Bistro floor plan</title>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="660" fill="#faf8f4"/>
  <!-- Kitchen, bar, restrooms -->
  <rect x="780" y="20" width="200" height="300" fill="#ece8e1"/>
  <path d="M780 20 V250 M780 310 V320 H980" fill="none" stroke="#5a5a5a" stroke-width="6"/>
  <text x="880" y="175" text-anchor="middle" font-size="24" fill="#8a8273" font-weight="600">Kitchen</text>
  <rect x="830" y="400" width="110" height="220" rx="14" fill="#d9cdb8" stroke="#a8977a" stroke-width="3"/>
  <text x="885" y="518" text-anchor="middle" font-size="24" fill="#6b5d45" font-weight="600">Bar</text>
  <rect x="20" y="540" width="160" height="140" fill="#ece8e1"/>
  <path d="M20 540 H120 M170 540 H180 V680" fill="none" stroke="#5a5a5a" stroke-width="6"/>
  <text x="100" y="620" text-anchor="middle" font-size="22" fill="#8a8273" font-weight="600">WC</text>
  <!-- Outer walls with entrance gap (x 420-540) -->
  <path d="M420 680 H20 V20 H980 V680 H540" fill="none" stroke="#3a3a3a" stroke-width="10" stroke-linejoin="round"/>
  <!-- Windows -->
  <g stroke="#8cc4e8" stroke-width="10">
    <line x1="100" y1="20" x2="260" y2="20"/>
    <line x1="340" y1="20" x2="500" y2="20"/>
    <line x1="580" y1="20" x2="740" y2="20"/>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <line x1="100" y1="20" x2="260" y2="20"/>
    <line x1="340" y1="20" x2="500" y2="20"/>
    <line x1="580" y1="20" x2="740" y2="20"/>
  </g>
  <text x="420" y="52" text-anchor="middle" font-size="16" fill="#7aa9c7">Windows · Abay Ave</text>
  <!-- Entrance -->
  <path d="M480 672 V630 M466 644 L480 628 L494 644" fill="none" stroke="#c0763a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="616" text-anchor="middle" font-size="20" fill="#c0763a" font-weight="600">Entrance</text>
</svg>
