<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Pyramid Billiards Club floor plan</title>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="660" fill="#f4f5f2"/>
  <!-- Bar counter -->
  <rect x="40" y="100" width="100" height="360" rx="14" fill="#d9cdb8" stroke="#a8977a" stroke-width="3"/>
  <text x="90" y="280" text-anchor="middle" font-size="24" fill="#6b5d45" font-weight="600" transform="rotate(-90 90 280)">Bar</text>
  <!-- Lounge -->
  <rect x="40" y="540" width="220" height="120" rx="18" fill="#e3e6df" stroke="#b9bfb2" stroke-width="3"/>
  <text x="150" y="608" text-anchor="middle" font-size="22" fill="#7d8573" font-weight="600">Lounge</text>
  <!-- Restrooms -->
  <rect x="860" y="20" width="120" height="120" fill="#e8e9e4"/>
  <path d="M860 20 V90 M860 130 V140 H980" fill="none" stroke="#5a5a5a" stroke-width="6"/>
  <text x="920" y="88" text-anchor="middle" font-size="22" fill="#7d8573" font-weight="600">WC</text>
  <!-- Cue rack -->
  <rect x="948" y="220" width="22" height="300" rx="4" fill="#b08a5a"/>
  <text x="930" y="370" text-anchor="middle" font-size="18" fill="#8a6a42" transform="rotate(-90 930 370)">Cue rack</text>
  <!-- Outer walls with entrance gap (x 780-900) -->
  <path d="M780 680 H20 V20 H980 V680 H900" fill="none" stroke="#3a3a3a" stroke-width="10" stroke-linejoin="round"/>
  <!-- Windows -->
  <g stroke="#8cc4e8" stroke-width="10">
    <line x1="300" y1="20" x2="460" y2="20"/>
    <line x1="540" y1="20" x2="700" y2="20"/>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <line x1="300" y1="20" x2="460" y2="20"/>
    <line x1="540" y1="20" x2="700" y2="20"/>
  </g>
  <!-- Entrance -->
  <path d="M840 672 V630 M826 644 L840 628 L854 644" fill="none" stroke="#c0763a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="840" y="616" text-anchor="middle" font-size="20" fill="#c0763a" font-weight="600">Entrance</text>
</svg>
