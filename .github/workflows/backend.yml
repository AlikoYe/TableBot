name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tablebot
          POSTGRES_PASSWORD: tablebot
          POSTGRES_DB: tablebot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tablebot -d tablebot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test (including DB integration tests)
        env:
          TEST_DATABASE_URL: postgres://tablebot:tablebot@localhost:5432/tablebot_test?sslmode=disable
        run: go test -race -count=1 -p 1 ./...

      - name: go build
        run: go build ./...
