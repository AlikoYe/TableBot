# Run from the repo root:  make up   (or see the Makefile for the full command)
name: tablebot

x-db-env: &db-env
  DATABASE_URL: postgres://${POSTGRES_USER:-tablebot}:${POSTGRES_PASSWORD:-tablebot}@postgres:5432/${POSTGRES_DB:-tablebot}?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tablebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tablebot}
      POSTGRES_DB: ${POSTGRES_DB:-tablebot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only, so `make dev` can reach it from the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ../backend
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ../backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *db-env
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Built by `make build-web` (npm run build) before `docker compose up`.
      - ../frontend/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
